<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตรวจสอบสถานะการชำระเงิน</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: radial-gradient(circle at top left, #1e293b, #0f172a);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 32px 26px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    h2 {
      font-size: 22px;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .subtext {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 22px;
    }
    .input-group {
      margin-bottom: 14px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      letter-spacing: 0.5px;
    }
    .input-group input:focus {
      border-color: #2563eb;
    }
    .btn-search {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-search:hover {
      background-color: #1d4ed8;
    }
    .btn-search:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    .result-box {
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      display: none;
      text-align: left;
    }
    .result-success {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }
    .result-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      text-align: center;
      font-size: 14px;
    }
    .student-header {
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .student-name {
      font-size: 17px;
      font-weight: 700;
      color: #0f172a;
    }
    .student-id {
      font-size: 13px;
      color: #64748b;
      margin-top: 2px;
    }
    .month-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 10px;
      text-align: center;
    }
    .month-item {
      padding: 6px 2px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
    }
    .status-paid {
      background-color: #dcfce7;
      color: #166534;
    }
    .status-unpaid {
      background-color: #fee2e2;
      color: #991b1b;
    }
    .status-leave {
      background-color: #fef3c7;
      color: #92400e;
    }
    .total-badge {
      margin-top: 14px;
      padding: 10px;
      background-color: #eff6ff;
      border-radius: 8px;
      font-size: 13px;
      color: #1e40af;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>ค้นหาข้อมูลเงินห้อง / กีฬาสี</h2>
    <p class="subtext">กรอกรหัสประจำตัว 11 หลักเพื่อตรวจสอบ</p>

    <form id="searchForm">
      <div class="input-group">
        <label for="studentId">รหัสประจำตัว</label>
        <input 
          type="text" 
          id="studentId" 
          placeholder="เช่น 67114640016" 
          maxlength="15" 
          required
        >
      </div>
      <button type="submit" class="btn-search" id="submitBtn">กำลังเตรียมข้อมูล...</button>
    </form>

    <div id="resultBox" class="result-box"></div>
  </div>

  <script>
    // วาง Web app URL ของ Apps Script ที่ได้จากขั้นตอนที่ 1
    const API_URL = "https://script.google.com/macros/s/AKfycbyYUqFmLqqAswp03PGphVUiurl4hc4DdoVfuvkHbCPv1Zq0Qj1xQnwsF4AuMpepg-IY/exec";

    let studentsData = [];
    const form = document.getElementById('searchForm');
    const input = document.getElementById('studentId');
    const resultBox = document.getElementById('resultBox');
    const submitBtn = document.getElementById('submitBtn');

    submitBtn.disabled = true;

    // ดึงข้อมูลล่วงหน้าทันทีที่โหลดหน้าเว็บ
    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        studentsData = data;
        submitBtn.disabled = false;
        submitBtn.innerText = "ค้นหา";
      })
      .catch(err => {
        submitBtn.innerText = "เชื่อมต่อชีตไม่สำเร็จ";
        console.error(err);
      });

    // กำหนดสี badge ตามสถานะในชีต
    function getStatusClass(text) {
      if (!text) return 'status-unpaid';
      if (text.includes('จ่ายแล้ว')) return 'status-paid';
      if (text.includes('ลาพัก')) return 'status-leave';
      return 'status-unpaid';
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const query = input.value.trim();
      const student = studentsData.find(item => item.id === query);

      resultBox.style.display = 'block';

      if (student) {
        resultBox.className = 'result-box result-success';
        resultBox.innerHTML = `
          <div class="student-header">
            <div class="student-name">${student.name}</div>
            <div class="student-id">รหัส: ${student.id}</div>
          </div>
          
          <div style="font-size: 12px; font-weight: 600; color: #475569;">สถานะรายเดือน:</div>
          <div class="month-grid">
            <div class="month-item ${getStatusClass(student.jun)}">มิ.ย.<br>${student.jun || '-'}</div>
            <div class="month-item ${getStatusClass(student.jul)}">ก.ค.<br>${student.jul || '-'}</div>
            <div class="month-item ${getStatusClass(student.aug)}">ส.ค.<br>${student.aug || '-'}</div>
            <div class="month-item ${getStatusClass(student.sep)}">ก.ย.<br>${student.sep || '-'}</div>
            <div class="month-item ${getStatusClass(student.oct)}">ต.ค.<br>${student.oct || '-'}</div>
          </div>

          <div class="total-badge">
            รวมเงินเก็บรายเดือน + ค่ากีฬาสี: ${student.total || '0'} บาท
          </div>
        `;
      } else {
        resultBox.className = 'result-box result-error';
        resultBox.innerHTML = `ไม่พบข้อมูลสำหรับรหัส <b>${query}</b>`;
      }
    });
  </script>

</body>
</html>
