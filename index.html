<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #1f2937, #111827);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
    }
    .login-card {
      background: #ffffff;
      padding: 36px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 360px;
    }
    .login-card h2 {
      margin-bottom: 24px;
      text-align: center;
      font-size: 24px;
      color: #111827;
    }
    .input-group {
      margin-bottom: 18px;
    }
    .input-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #4b5563;
      font-weight: 600;
    }
    .input-group input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-group input:focus {
      border-color: #2563eb;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background-color: #1d4ed8;
    }
    .message {
      margin-top: 14px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>เข้าสู่ระบบ</h2>
    <form id="loginForm">
      <div class="input-group">
        <label for="username">ชื่อผู้ใช้ / อีเมล</label>
        <input type="text" id="username" placeholder="ระบุชื่อผู้ใช้" required>
      </div>
      <div class="input-group">
        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" placeholder="ระบุรหัสผ่าน" required>
      </div>
      <button type="submit" class="btn-submit">Login</button>
      <div id="statusMessage" class="message"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('statusMessage');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const pass = document.getElementById('password').value;

      // ตัวอย่างการจำลองตรวจชื่อและรหัสผ่านง่ายๆ ในฝั่ง Client
      if (username === 'admin' && pass === '1234') {
        msg.style.color = '#16a34a';
        msg.innerText = 'เข้าสู่ระบบสำเร็จ!';
      } else {
        msg.style.color = '#dc2626';
        msg.innerText = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
      }
    });
  </script>

</body>
</html>
