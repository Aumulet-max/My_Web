<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบค้นหาข้อมูลนักศึกษา</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: radial-gradient(circle at top left, #1e293b, #0f172a);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .search-card {
      background: #ffffff;
      padding: 36px 30px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .search-card h2 {
      font-size: 24px;
      color: #0f172a;
      margin-bottom: 8px;
    }
    .search-card p {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      letter-spacing: 1px;
      transition: border-color 0.2s ease;
    }
    .input-group input:focus {
      border-color: #2563eb;
    }
    .btn-search {
      width: 100%;
      padding: 13px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn-search:hover {
      background-color: #1d4ed8;
    }
    .result-box {
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      display: none;
      text-align: left;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .result-success {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }
    .result-error {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      text-align: center;
    }
    .result-title {
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 700;
      color: #15803d;
      margin-bottom: 4px;
    }
    .student-name {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
    }
    .student-meta {
      font-size: 13px;
      color: #475569;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="search-card">
    <h2>ค้นหาข้อมูลนักศึกษา</h2>
    <p>กรอกรหัสนักศึกษาเพื่อตรวจสอบรายชื่อ</p>

    <form id="searchForm">
      <div class="input-group">
        <label for="studentId">รหัสนักศึกษา</label>
        <input 
          type="text" 
          id="studentId" 
          placeholder="เช่น 66010001" 
          maxlength="15" 
          autocomplete="off" 
          required
        >
      </div>
      <button type="submit" class="btn-search">ค้นหา</button>
    </form>

    <div id="resultBox" class="result-box"></div>
  </div>

  <script>
    // รายชื่อนักศึกษาจำลอง (สามารถเพิ่มข้อมูลในนี้ได้ตามต้องการ)
    const studentDatabase = [
      { id: "66010001", name: "สมชาย สายลุย", major: "เทคโนโลยีสารสนเทศ" },
      { id: "66010002", name: "สมหญิง จริงใจ", major: "วิทยาการคอมพิวเตอร์" },
      { id: "67010003", name: "กิตติศักดิ์ พัฒนา", major: "วิศวกรรมซอฟต์แวร์" }
    ];

    const form = document.getElementById('searchForm');
    const input = document.getElementById('studentId');
    const resultBox = document.getElementById('resultBox');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const queryId = input.value.trim();

      // ค้นหาจากรหัส
      const found = studentDatabase.find(student => student.id === queryId);

      resultBox.style.display = 'block';

      if (found) {
        resultBox.className = 'result-box result-success';
        resultBox.innerHTML = `
          <div class="result-title">พบข้อมูลนักศึกษา</div>
          <div class="student-name">${found.name}</div>
          <div class="student-meta">รหัส: ${found.id} | สาขา: ${found.major}</div>
        `;
      } else {
        resultBox.className = 'result-box result-error';
        resultBox.innerHTML = `ไม่พบข้อมูลของรหัสนักศึกษา <b>${queryId}</b>`;
      }
    });
  </script>

</body>
</html>
