<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตรวจสอบสถานะการชำระเงิน</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h2>ค้นหาข้อมูลเงินห้อง / กีฬาสี</h2>
    <p class="subtext">กรอกรหัสประจำตัว 11 หลักเพื่อตรวจสอบ</p>

    <form id="searchForm">
      <div class="input-group">
        <label for="studentId">รหัสประจำตัว</label>
        <input 
          type="text" 
          id="studentId" 
          placeholder="เช่น 67114640016" 
          maxlength="15" 
          required
        >
      </div>
      <button type="submit" class="btn-search" id="submitBtn">กำลังเตรียมข้อมูล...</button>
    </form>

    <div id="resultBox" class="result-box"></div>
  </div>
<script src="script.js"></script>
</body>
</html>
